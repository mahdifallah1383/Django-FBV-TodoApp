{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <!-- User Profile -->
    <header class="header">
      <div class="user-profile">
        <img
          src="https://i.pravatar.cc/100?img=12"
          alt="تصویر کاربر"
          class="user-avatar"
        />

        <div class="user-info">
          <span class="user-name">مهدی احمدی</span>
          <span class="user-role">کاربر</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="todo-container">
      <h1>لیست کارها</h1>
      <p class="subtitle">کارهای روزانه خود را مدیریت کنید</p>

      <!-- Add Task -->
      <form
        class="add-task"
        method="post"
        action="{% url 'todo:create-task' %}"
      >
        {% csrf_token %}
        <input
          type="text"
          name="title"
          placeholder="کار جدید را وارد کنید..."
          autocomplete="off"
          required
        />

        <button type="submit" class="add-button">+</button>
      </form>

      <!-- Tasks -->
      <div class="tasks-container" id="tasksContainer">
        <!-- Example Task -->

        {% for task in tasks %} {% if task.complete %}
        <div class="task completed">
          <div class="task-content">
            <input
              type="radio"
              class="task-radio"
              checked
              onclick="window.location = '{% url "todo:complete-task" task.id %}'"
            />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <a
              class="edit-button"
              href="{% url 'todo:update-task' task.id%}"
              >✎</a
            >

            <a
              class="delete-button"
              href="{% url 'todo:delete-task' task.id %}"
              >🗑</a
            >
          </div>
        </div>
        {% else %}
        <div class="task">
          <div class="task-content">
            <input type="radio" class="task-radio" onclick="window.location = '{% url "todo:complete-task" task.id %}'" />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <a
              class="edit-button"
              href="{% url 'todo:update-task' task.id%}"
              >✎</a
            >

            <a
              class="delete-button"
              href="{% url 'todo:delete-task' task.id %}"
              >🗑</a
            >
          </div>
        </div>
        {% endif %} {% endfor %}
      </div>
    </main>
  </body>
</html>
