{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <!-- User Profile -->
    <header class="header">
      <div class="user-profile">
        <img
          src="https://i.pravatar.cc/100?img=12"
          alt="تصویر کاربر"
          class="user-avatar"
        />

        <div class="user-info">
          <span class="user-name">مهدی احمدی</span>
          <span class="user-role">کاربر</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="todo-container">
      <h1>لیست کارها</h1>
      <p class="subtitle">کارهای روزانه خود را مدیریت کنید</p>

      <!-- Add Task -->
      <div class="add-task">
        <input
          type="text"
          id="taskInput"
          placeholder="کار جدید را وارد کنید..."
        />

        <button id="addButton" class="add-button">+</button>
      </div>

      <!-- Tasks -->
      <div class="tasks-container" id="tasksContainer">
        <!-- Example Task -->

        {% for task in tasks %} {% if task.complete %}
        <div class="task completed">
          <div class="task-content">
            <input type="radio" class="task-radio" checked />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <button class="edit-button">✎</button>

            <button class="delete-button">🗑</button>
          </div>
        </div>
        {% else %}
        <div class="task">
          <div class="task-content">
            <input type="radio" class="task-radio" />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <button class="edit-button">✎</button>

            <button class="delete-button">🗑</button>
          </div>
        </div>
        {% endif %} {% endfor %}
      </div>
    </main>

    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
