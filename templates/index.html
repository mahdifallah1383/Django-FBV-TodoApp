{% load static %}

<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <!-- User Profile -->
    <header class="header">
      <div class="user-profile">
        <img
          src="https://i.pravatar.cc/100?img=12"
          alt="تصویر کاربر"
          class="user-avatar"
        />

        <div class="user-info">
          <span class="user-name">مهدی احمدی</span>
          <span class="user-role">کاربر</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="todo-container">
      <h1>لیست کارها</h1>
      <p class="subtitle">کارهای روزانه خود را مدیریت کنید</p>

      <!-- Add Task -->
      <div class="add-task">
        <input
          type="text"
          id="taskInput"
          placeholder="کار جدید را وارد کنید..."
        />

        <button id="addButton" class="add-button">+</button>
      </div>

      <!-- Tasks -->
      <div class="tasks-container" id="tasksContainer">
        <!-- Example Task -->

        {% for task in tasks %} {% if task.complete %}
        <div class="task completed">
          <div class="task-content">
            <input type="radio" class="task-radio" checked />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <button class="edit-button">✎</button>

            <button class="delete-button">🗑</button>
          </div>
        </div>
        {% else %}
        <div class="task">
          <div class="task-content">
            <input type="radio" class="task-radio" />

            <span class="task-title"> {{task.title}}</span>
          </div>

          <div class="task-actions">
            <button class="edit-button">✎</button>

            <button class="delete-button">🗑</button>
          </div>
        </div>
        {% endif %} {% endfor %}
      </div>
    </main>

    <script>
      const taskInput = document.getElementById("taskInput");
      const addButton = document.getElementById("addButton");
      const tasksContainer = document.getElementById("tasksContainer");

      // Add new task
      function addTask() {
        const title = taskInput.value.trim();

        if (title === "") {
          return;
        }

        const task = document.createElement("div");
        task.classList.add("task");

        task.innerHTML = `
                <div class="task-content">

                    <input
                        type="radio"
                        class="task-radio"
                    >

                    <span class="task-title">
                        ${title}
                    </span>

                </div>

                <div class="task-actions">

                    <button class="edit-button">
                        ✎
                    </button>

                    <button class="delete-button">
                        🗑
                    </button>

                </div>
            `;

        tasksContainer.appendChild(task);

        taskInput.value = "";

        addTaskEvents(task);
      }

      // Add button
      addButton.addEventListener("click", addTask);

      // Enter key
      taskInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          addTask();
        }
      });

      // Task events
      function addTaskEvents(task) {
        const radio = task.querySelector(".task-radio");
        const deleteButton = task.querySelector(".delete-button");
        const editButton = task.querySelector(".edit-button");

        // مقدار اولیه Radio
        radio.dataset.checked = radio.checked ? "true" : "false";

        // Complete / Uncomplete task
        radio.addEventListener("click", function (event) {
          if (radio.dataset.checked === "true") {
            radio.checked = false;
            radio.dataset.checked = "false";

            task.classList.remove("completed");
          } else {
            radio.checked = true;
            radio.dataset.checked = "true";

            task.classList.add("completed");
          }
        });

        // Delete task
        deleteButton.addEventListener("click", function () {
          task.remove();
        });

        // Edit task
        editButton.addEventListener("click", function () {
          const title = task.querySelector(".task-title");

          const newTitle = prompt(
            "عنوان جدید را وارد کنید:",
            title.textContent.trim(),
          );

          if (newTitle !== null && newTitle.trim() !== "") {
            title.textContent = newTitle.trim();
          }
        });
      }

      // Activate events for existing tasks
      document.querySelectorAll(".task").forEach(addTaskEvents);
    </script>
  </body>
</html>
